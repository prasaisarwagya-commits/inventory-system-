<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers - Inventory Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">📦 Inventory MS</span>
  <button class="hamburger" id="hamburgerBtn">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="products.html">Products</a>
    <a href="suppliers.html" class="active">Suppliers</a>
    <div class="nav-user">
      <span id="navUsername"></span>
      <button id="logoutBtn">Log Out</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Suppliers</h1>
    <a href="supplier-form.html" class="btn btn-primary">+ Add Supplier</a>
  </div>

  <div id="alertBox" class="alert alert-error"></div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact Email</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="suppliersBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No suppliers found.</div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  guardPage();

  const suppliersBody = document.getElementById('suppliersBody');
  const emptyState = document.getElementById('emptyState');
  const alertBox = document.getElementById('alertBox');

  function showError(message) {
    alertBox.textContent = message;
    alertBox.classList.add('visible');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadSuppliers() {
    try {
      const suppliers = await apiFetch('/suppliers');
      suppliersBody.innerHTML = '';
      emptyState.style.display = suppliers.length === 0 ? 'block' : 'none';

      suppliers.forEach((s) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(s.name)}</td>
          <td>${escapeHtml(s.contactEmail)}</td>
          <td>${escapeHtml(s.phone)}</td>
          <td class="actions-cell">
            <a class="btn btn-secondary btn-sm" href="supplier-form.html?id=${s.id}">Edit</a>
            <button class="btn btn-danger btn-sm" data-delete="${s.id}">Delete</button>
          </td>
        `;
        suppliersBody.appendChild(tr);
      });

      document.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteSupplier(btn.getAttribute('data-delete')));
      });
    } catch (err) {
      showError(err.message);
    }
  }

  async function deleteSupplier(id) {
    if (!confirm('Delete this supplier?')) return;
    try {
      await apiFetch(`/suppliers/${id}`, { method: 'DELETE' });
      loadSuppliers();
    } catch (err) {
      showError(err.message);
    }
  }

  loadSuppliers();
</script>
</body>
</html>
