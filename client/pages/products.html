<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Inventory Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">📦 Inventory MS</span>
  <button class="hamburger" id="hamburgerBtn">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="products.html" class="active">Products</a>
    <a href="suppliers.html">Suppliers</a>
    <div class="nav-user">
      <span id="navUsername"></span>
      <button id="logoutBtn">Log Out</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Products</h1>
    <a href="product-form.html" class="btn btn-primary">+ Add Product</a>
  </div>

  <div id="alertBox" class="alert alert-error"></div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search by product name...">
    <select id="supplierFilter">
      <option value="">All Suppliers</option>
    </select>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Supplier</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsBody">
        </tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No products found.</div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  guardPage();

  const productsBody = document.getElementById('productsBody');
  const emptyState = document.getElementById('emptyState');
  const alertBox = document.getElementById('alertBox');
  const searchInput = document.getElementById('searchInput');
  const supplierFilter = document.getElementById('supplierFilter');

  let debounceTimer = null;

  function showError(message) {
    alertBox.textContent = message;
    alertBox.classList.add('visible');
  }

  async function loadSupplierOptions() {
    try {
      const suppliers = await apiFetch('/suppliers');
      suppliers.forEach((s) => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        supplierFilter.appendChild(opt);
      });
    } catch (err) {
      showError(err.message);
    }
  }

  async function loadProducts() {
    const params = new URLSearchParams();
    if (searchInput.value.trim()) params.set('search', searchInput.value.trim());
    if (supplierFilter.value) params.set('supplierId', supplierFilter.value);

    try {
      const products = await apiFetch(`/products?${params.toString()}`);
      renderProducts(products);
    } catch (err) {
      showError(err.message);
    }
  }

  function renderProducts(products) {
    productsBody.innerHTML = '';
    emptyState.style.display = products.length === 0 ? 'block' : 'none';

    products.forEach((p) => {
      const tr = document.createElement('tr');
      if (p.lowStock) tr.classList.add('low-stock');

      const imgUrl = resolveImageUrl(p.imagePath);
      tr.innerHTML = `
        <td>${imgUrl ? `<img class="thumb" src="${imgUrl}" alt="${escapeHtml(p.name)}">` : '<div class="thumb"></div>'}</td>
        <td>${escapeHtml(p.name)}</td>
        <td>${p.Supplier ? escapeHtml(p.Supplier.name) : '—'}</td>
        <td>$${Number(p.price).toFixed(2)}</td>
        <td>${p.quantity}</td>
        <td>${p.lowStock ? '<span class="badge badge-danger">Low Stock</span>' : '<span class="badge badge-ok">OK</span>'}</td>
        <td class="actions-cell">
          <a class="btn btn-secondary btn-sm" href="product-view.html?id=${p.id}">View</a>
          <a class="btn btn-secondary btn-sm" href="product-form.html?id=${p.id}">Edit</a>
          <button class="btn btn-danger btn-sm" data-delete="${p.id}">Delete</button>
        </td>
      `;
      productsBody.appendChild(tr);
    });

    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => deleteProduct(btn.getAttribute('data-delete')));
    });
  }

  async function deleteProduct(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    try {
      await apiFetch(`/products/${id}`, { method: 'DELETE' });
      loadProducts();
    } catch (err) {
      showError(err.message);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadProducts, 300);
  });
  supplierFilter.addEventListener('change', loadProducts);

  loadSupplierOptions();
  loadProducts();
</script>
</body>
</html>
