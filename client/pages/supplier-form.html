<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Form - Inventory Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">📦 Inventory MS</span>
  <button class="hamburger" id="hamburgerBtn">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="products.html">Products</a>
    <a href="suppliers.html" class="active">Suppliers</a>
    <div class="nav-user">
      <span id="navUsername"></span>
      <button id="logoutBtn">Log Out</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 id="formTitle">Add Supplier</h1>
    <a href="suppliers.html" class="btn btn-secondary">← Back to Suppliers</a>
  </div>

  <div id="alertBox" class="alert alert-error"></div>

  <div class="form-card">
    <form id="supplierForm" novalidate>
      <div class="form-group">
        <label for="name">Supplier Name *</label>
        <input type="text" id="name" name="name" required>
        <span class="field-error" id="nameError">Supplier name is required</span>
      </div>

      <div class="form-group">
        <label for="contactEmail">Contact Email *</label>
        <input type="email" id="contactEmail" name="contactEmail" required>
        <span class="field-error" id="contactEmailError">A valid email is required</span>
      </div>

      <div class="form-group">
        <label for="phone">Phone *</label>
        <input type="text" id="phone" name="phone" required>
        <span class="field-error" id="phoneError">Phone number is required</span>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Save Supplier</button>
        <a href="suppliers.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  guardPage();

  const params = new URLSearchParams(window.location.search);
  const supplierId = params.get('id');
  const isEdit = Boolean(supplierId);

  const form = document.getElementById('supplierForm');
  const alertBox = document.getElementById('alertBox');

  if (isEdit) {
    document.getElementById('formTitle').textContent = 'Edit Supplier';
    document.getElementById('submitBtn').textContent = 'Update Supplier';
  }

  function showError(message) {
    alertBox.textContent = message;
    alertBox.classList.add('visible');
  }
  function clearError() {
    alertBox.classList.remove('visible');
  }

  async function loadSupplierIfEditing() {
    if (!isEdit) return;
    try {
      const s = await apiFetch(`/suppliers/${supplierId}`);
      document.getElementById('name').value = s.name;
      document.getElementById('contactEmail').value = s.contactEmail;
      document.getElementById('phone').value = s.phone;
    } catch (err) {
      showError(err.message);
    }
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function validateForm() {
    let valid = true;
    const name = document.getElementById('name');
    const email = document.getElementById('contactEmail');
    const phone = document.getElementById('phone');

    const setFieldError = (errorId, condition) => {
      document.getElementById(errorId).classList.toggle('visible', condition);
      if (condition) valid = false;
    };

    setFieldError('nameError', !name.value.trim());
    setFieldError('contactEmailError', !isValidEmail(email.value.trim()));
    setFieldError('phoneError', !phone.value.trim());

    return valid;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    if (!validateForm()) return;

    const payload = {
      name: document.getElementById('name').value.trim(),
      contactEmail: document.getElementById('contactEmail').value.trim(),
      phone: document.getElementById('phone').value.trim(),
    };

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    try {
      if (isEdit) {
        await apiFetch(`/suppliers/${supplierId}`, { method: 'PUT', body: payload });
      } else {
        await apiFetch('/suppliers', { method: 'POST', body: payload });
      }
      window.location.href = 'suppliers.html';
    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = isEdit ? 'Update Supplier' : 'Save Supplier';
    }
  });

  loadSupplierIfEditing();
</script>
</body>
</html>
